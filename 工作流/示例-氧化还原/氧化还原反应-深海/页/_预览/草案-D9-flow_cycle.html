<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
/* ============================================================
 * 主题骨架 —— 全套主题 CSS 的唯一结构源
 *
 * 新主题 = 复制本文件为 库/theme-<主题名>.css，只改 :root 里 12 个
 * 配色令牌的值，不许改下面的规则。
 * 要改规则 = 改本骨架（会影响所有主题，慎重）。
 *
 * 纪律：规则里不许出现硬编码色值，一律走 var(--令牌)。
 * ============================================================ */
:root{
  /* ---- 配色令牌（新主题只改这 10 个值） ---- */
  --bg:#0B1224;          /* 知识页底 */
  --bg-dark:#060C1A;     /* 深底：封面/章节页底 */
  --gold:#35D5E8;        /* 唯一核心强调（眉题/徽章/装饰条；只做大文本与装饰，不做正文） */
  --gold-soft:#8FEDFA;   /* 次级强调 */
  --ink:#F4F7FC;         /* 正文墨色（须与 --bg 对比度 ≥ 4.5） */
  --green:#55D6A1;       /* 标题/标签/章名（须与 --bg 对比度 ≥ 3.0） */
  --silver:#9BAAC2;      /* 深底辅助字 */
  --muted:#64748F;       /* 浅底弱化字 */
  --line:#22344F;        /* 发丝线 */
  --card:#142541;        /* 卡底 */
  --ox:#FF9F43;          /* 氧化橙：氧化过程语义色（徽章/大文本/装饰；须与 --bg 对比度 ≥ 3.0） */
  --ink-dark:#F4F7FC;    /* 深底正文字：在 --bg-dark 上的正文色（须与 --bg-dark 对比度 ≥ 4.5） */

  /* ---- 字号阶（16:9 @1920） ---- */
  --fs-page-title:62px; --fs-section-title:118px;
  --fs-body-n:29px; --fs-body:22px; --fs-desc:19px;
  --fs-kick:19px; --fs-brow:21px; --fs-cap:19px;

  /* ---- 间距 ---- */
  --mx:120px;            /* 页边距 */
  --head-top:126px;      /* 页头起始 */
}

/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{position:relative;background:var(--bg);color:var(--ink);
     font-family:"思源黑体","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","PingFang SC",sans-serif}
body.dark{background:var(--bg-dark);color:var(--ink-dark)}

/* ============ 页眉系统（每页复用） ============ */
.brow{position:absolute;left:var(--mx);top:60px;font-family:Georgia,serif;
      font-size:var(--fs-brow);color:var(--green);letter-spacing:.38em;text-transform:uppercase}
body.dark .brow{color:var(--silver);opacity:.75}
.pageno{position:absolute;right:var(--mx);top:60px;font-family:Georgia,serif;
        font-size:var(--fs-brow);color:var(--muted);letter-spacing:.2em}
body.dark .pageno{color:var(--silver);opacity:.6}

/* ============ 页头（kick 眉题 + 大标题） ============ */
.head{position:absolute;left:var(--mx);top:var(--head-top);width:1680px}
.kick{font-family:Georgia,serif;font-size:var(--fs-kick);color:var(--gold);
      letter-spacing:.3em;font-weight:700}
h1{margin-top:14px;font-size:var(--fs-page-title);color:var(--ink);
   font-weight:800;letter-spacing:.04em;line-height:1.25}
h1 .q{color:var(--green)}          /* 标题里的强调半句 */
span.ox{color:var(--ox)}            /* 行内氧化橙强调（须与背景对比度 ≥ 3.0，大文本/短语用） */
body.dark h1{color:var(--ink-dark)}

/* ============ 页脚（发丝线 + 右注） ============ */
.foot-line{position:absolute;left:var(--mx);bottom:50px;width:1680px;height:1px;background:var(--line)}
body.dark .foot-line{background:#3A423F}
.foot{position:absolute;right:var(--mx);bottom:64px;font-size:18px;
      color:var(--muted);letter-spacing:.12em}
body.dark .foot{color:var(--silver)}
.foot-left{position:absolute;left:var(--mx);bottom:64px;font-size:18px;
           color:var(--muted);letter-spacing:.12em}

/* ============ 结构件（总则 6.5 点缀件） ============ */
.badge{display:inline-flex;align-items:center;justify-content:center;
       font-weight:700;letter-spacing:.14em}
.badge.ink{background:var(--ink);color:var(--bg)}
.badge.green{background:var(--green);color:var(--bg)}
.badge.gold{background:var(--gold);color:var(--bg-dark)}
.badge.ox{background:var(--ox);color:var(--bg-dark)}

.concl{background:var(--card);border-left:6px solid var(--gold);
       padding:22px 28px;font-size:var(--fs-body);color:var(--ink);line-height:1.75}
.concl b{color:var(--green)}

.numdot{width:48px;height:48px;flex:none;background:var(--green);color:var(--bg);
        font-family:Georgia,serif;font-size:24px;font-weight:700;
        display:flex;align-items:center;justify-content:center;border-radius:50%}

.hairline{border-bottom:1px solid var(--line)}
body.dark .hairline{border-bottom:1px solid #3A423F}

/* ============ 图件 ============ */
.photo{outline:1px solid var(--line);outline-offset:-1px;
       background-position:center;background-size:cover;background-repeat:no-repeat}
.photo.contain{background-size:contain;background-color:var(--bg-dark)}
.cap{font-size:var(--fs-cap);color:var(--muted);letter-spacing:.1em;text-align:center}
.tag{position:absolute;background:rgba(37,44,43,.82);color:var(--ink-dark);
     font-size:20px;letter-spacing:.14em;padding:10px 22px}
.tag b{color:var(--gold)}

/* ============ 章节页专用 ============ */
.ghost{position:absolute;right:96px;top:60px;font-family:Georgia,serif;
       font-size:560px;font-weight:700;color:var(--gold);opacity:.14;
       line-height:1;letter-spacing:-.02em}
.gold-rule{width:84px;height:4px;background:var(--gold)}

</style>
<style>
  .twrap{position:absolute;left:var(--mx);top:340px;width:1680px}
  .concl{margin-top:8px}
</style>
</head>
<body class="">
  <div class="brow">xx</div><div class="pageno">09 / 18</div>
  <div class="head"><div class="kick">LAYOUT DRAFT</div>
    <h1>氧化反应与还原反应的关系<span class="q">（只看布局）</span></h1></div>

ar(--card);stroke:var(--green);stroke-width:4" /><text dominant-baseline="central" font-family="'思源黑体','Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="36" font-weight="800" style="fill:var(--green)" text-anchor="middle" x="1212" y="385">节点二</text><circle cx="468" cy="385" r="86" style="fill:var(--card);stroke:var(--green);stroke-width:4" /><text dominant-baseline="central" font-family="'思源黑体','Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="36" font-weight="800" style="fill:var(--green)" text-anchor="middle" x="468" y="385">节点三</text></svg>
    <div class="concl concl">占位结论条</div>
  </div>
  <div class="foot-line"></div>
  <div class="foot">占位页脚</div>
</body>
</html>
