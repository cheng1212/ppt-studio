<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
/* ============================================================
 * 主题骨架 —— 全套主题 CSS 的唯一结构源
 * （本文件由 程序/主题同步.py 从骨架生成，只改 :root 值）
 *
 * 新主题 = 复制本文件为 库/theme-<主题名>.css，只改 :root 里 13 个
 * 配色令牌的值，不许改下面的规则。
 * 要改规则 = 改本骨架（会影响所有主题，慎重）。
 *
 * 纪律：规则里不许出现硬编码色值，一律走 var(--令牌)；
 *       字号一律走 var(--fs-*)，不许写 font-size:<数字>px（校验器机检）。
 * ============================================================ */
:root{
  /* ---- 配色令牌（新主题只改这 13 个值） ---- */
  --bg:#FFFBF3;          /* 知识页底 */
  --bg-dark:#DCEBF9;     /* 深底：封面/章节页底 */
  --gold:#4A90D9;        /* 唯一核心强调（眉题/徽章/装饰条；只做大文本与装饰，不做正文） */
  --gold-soft:#D6E8F8;   /* 次级强调 */
  --ink:#2E3E5C;         /* 正文墨色（须与 --bg 对比度 ≥ 7.0，投影线） */
  --green:#3E7CB1;       /* 标题/标签/章名（须与 --bg 对比度 ≥ 3.0） */
  --silver:#9AA8BC;      /* 深底辅助字 */
  --muted:#6E7E94;       /* 浅底弱化字 */
  --line:#E7DCC4;        /* 发丝线 */
  --line-dark:#C9D8E8;   /* 发丝线在深底上的版本（body.dark 用） */
  --card:#FFFFFF;        /* 卡底 */
  --ox:#C96A00;          /* 氧化橙：氧化过程语义色（徽章/大文本/装饰；须与 --bg 对比度 ≥ 3.0） */
  --ink-dark:#2E3E5C;    /* 深底正文字：在 --bg-dark 上的正文色（须与 --bg-dark 对比度 ≥ 4.5） */

  /* ---- 字号阶（16:9 @1920；v2 2026-10-05 按设计规约重定：投影实线） ---- */
  --fs-page-title:64px; --fs-section-title:118px; --fs-hero:200px;
  --fs-body-n:45px; --fs-body:34px; --fs-desc:22px;
  --fs-kick:22px; --fs-brow:22px; --fs-cap:22px;

  /* ---- 间距 ---- */
  --mx:120px;            /* 页边距（约 6%；设计规约建议 10%，改大需重调模板内部间距） */
  --head-top:126px;      /* 页头起始 */
  --cw:calc(1920px - var(--mx) * 2);  /* 内容宽：改 --mx 自动跟随，模板里不许写 1680px */
  --space-1:8px;         /* 相关项间距 */
  --space-2:16px;        /* 区块间距 */
  --space-3:32px;        /* 大分区/栏间距 */
}

/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{position:relative;background:var(--bg);color:var(--ink);
     font-family:"思源黑体","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
     text-autospace:normal}  /* CJK与西文/数字间自动空格（CLREQ） */
body.dark{background:var(--bg-dark);color:var(--ink-dark)}

/* 数字上下文一律等宽 lining figures（表格/KPI/编号，禁比例数字） */
.num,.kpi-num,td,.node .t,.v .n,.step3 .num,.eqhero .eq{font-variant-numeric:tabular-nums lining-nums}

/* ============ 页眉系统（每页复用） ============ */
.brow{position:absolute;left:var(--mx);top:60px;font-family:Georgia,serif;
      font-size:var(--fs-brow);color:var(--green);letter-spacing:.38em;text-transform:uppercase}
body.dark .brow{color:var(--silver);opacity:.75}
.pageno{position:absolute;right:var(--mx);top:60px;font-family:Georgia,serif;
        font-size:var(--fs-brow);color:var(--muted);letter-spacing:.2em}
body.dark .pageno{color:var(--silver);opacity:.6}

/* ============ 页头（kick 眉题 + 大标题） ============ */
.head{position:absolute;left:var(--mx);top:var(--head-top);width:var(--cw)}
.kick{font-family:Georgia,serif;font-size:var(--fs-kick);color:var(--gold);
      letter-spacing:.3em;font-weight:700}
h1{margin-top:14px;font-size:var(--fs-page-title);color:var(--ink);
   font-weight:800;letter-spacing:.04em;line-height:1.15}
h1 .q{color:var(--green)}          /* 标题里的强调半句 */
span.ox{color:var(--ox)}            /* 行内氧化橙强调（须与背景对比度 ≥ 3.0，大文本/短语用） */
body.dark h1{color:var(--ink-dark)}

/* ============ 页脚（发丝线 + 右注） ============ */
.foot-line{position:absolute;left:var(--mx);bottom:50px;width:var(--cw);height:1px;background:var(--line)}
body.dark .foot-line{background:var(--line-dark)}
.foot{position:absolute;right:var(--mx);bottom:64px;font-size:var(--fs-cap);
      color:var(--muted);letter-spacing:.12em}
body.dark .foot{color:var(--silver)}
.foot-left{position:absolute;left:var(--mx);bottom:64px;font-size:var(--fs-cap);
           color:var(--muted);letter-spacing:.12em}

/* ============ 结构件（总则 6.5 点缀件） ============ */
.badge{display:inline-flex;align-items:center;justify-content:center;
       font-weight:700;letter-spacing:.14em}
.badge.ink{background:var(--ink);color:var(--bg)}
.badge.green{background:var(--green);color:var(--bg)}
.badge.gold{background:var(--gold);color:var(--bg-dark)}
.badge.ox{background:var(--ox);color:var(--bg-dark)}

.concl{background:var(--card);border-left:6px solid var(--gold);
       padding:22px 28px;font-size:var(--fs-body);color:var(--ink);line-height:1.5}
.concl b{color:var(--green)}

.numdot{width:48px;height:48px;flex:none;background:var(--green);color:var(--bg);
        font-family:Georgia,serif;font-size:var(--fs-cap);font-weight:700;
        display:flex;align-items:center;justify-content:center;border-radius:50%}

.hairline{border-bottom:1px solid var(--line)}
body.dark .hairline{border-bottom:1px solid var(--line-dark)}

/* ============ 图件 ============ */
.photo{outline:1px solid var(--line);outline-offset:-1px;
       background-position:center;background-size:cover;background-repeat:no-repeat}
.photo.contain{background-size:contain;background-color:var(--bg-dark)}
.cap{font-size:var(--fs-cap);color:var(--muted);letter-spacing:.1em;text-align:center}
.tag{position:absolute;background:color-mix(in srgb, var(--bg-dark) 82%, transparent);color:var(--ink-dark);
     font-size:var(--fs-cap);letter-spacing:.14em;padding:10px 22px}
.tag b{color:var(--gold)}

/* ============ 章节页专用 ============ */
.ghost{position:absolute;right:96px;top:60px;font-family:Georgia,serif;
       font-size:560px;font-weight:700;color:var(--gold);opacity:.14;
       line-height:1;letter-spacing:-.02em}
.gold-rule{width:84px;height:4px;background:var(--gold)}

/* ============ 背景系统 v1（2026-10-05）============
   用法：pages.json 里 "bg": "dots"（或 grid/diagonal/mesh/glow/none）。
   页面生成.py 把 bg 值拼到 body class：<body class="bg-dots">。
   全部用主题令牌 + 低透明度，保证换主题不翻车。 */

/* 点阵 */
body.bg-dots{background-image:radial-gradient(var(--line) 1.2px, transparent 1.3px);
  background-size:36px 36px}
/* 网格线 */
body.bg-grid{background-image:linear-gradient(var(--line) 1px, transparent 1px),
  linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:72px 72px}
/* 斜线 */
body.bg-diagonal{background-image:repeating-linear-gradient(45deg,
  transparent 0 18px, var(--line) 18px 19px)}
/* 渐变 mesh：左上强调色微光 + 右下冷光 */
body.bg-mesh{background:
  radial-gradient(900px 600px at 12% 8%, var(--gold-soft) 0%, transparent 60%),
  radial-gradient(1000px 700px at 88% 95%, var(--line) 0%, transparent 55%),
  var(--bg)}
/* 角落光晕 */
body.bg-glow{background:
  radial-gradient(700px 420px at 85% 12%, var(--gold-soft) 0%, transparent 65%),
  var(--bg)}

/* ============ 图片蒙版 v1 ============
   用法：pages.json "mask": "circle|rounded|blob|arch"，作用于模板的图片容器。
   页面生成.py 的 _maskcls(p) 把 mask-<值> 拼到图片 div 的 class。 */
.mask-circle{border-radius:50%!important;overflow:hidden}
.mask-rounded{border-radius:48px!important;overflow:hidden}
.mask-blob{border-radius:38% 62% 55% 45%/48% 38% 62% 52%!important;overflow:hidden}
.mask-arch{border-radius:999px 999px 28px 28px!important;overflow:hidden}

</style>
<style>
  .twrap{position:absolute;left:var(--mx);top:340px;width:var(--cw)}
  .root{margin:0 auto;width:520px;background:var(--green);color:#F5F3ED;
        text-align:center;padding:26px 30px}
  .root .t{font-size:var(--fs-body);font-weight:800;letter-spacing:.06em}
  .root .d{margin-top:8px;font-size:var(--fs-cap);opacity:.85;letter-spacing:.04em}
  .forkrow{display:flex;justify-content:center;gap:60px}
  .branch{width:520px;flex:none;background:var(--card);outline:1px solid var(--line);
          padding:30px 34px}
  .cond{display:inline-block;background:var(--gold);color:var(--ink);font-weight:800;
        font-size:var(--fs-cap);letter-spacing:.14em;padding:10px 26px}
  .res{margin-top:16px;font-size:var(--fs-body-n);color:var(--green);font-weight:800;letter-spacing:.04em}
  .bd{margin-top:10px;font-size:var(--fs-body);color:var(--muted);line-height:1.7}
  .concl{margin-top:30px}
</style>
</head>
<body class="">
  <div class="brow">Unit 5 · What does he do?</div><div class="pageno">12</div>
  <div class="head"><div class="kick">MIND MAP</div>
    <h1>知识导图</h1></div>
  <div class="twrap">
    <div class="root"><div class="t">Jobs</div>
      <div class="d">职业</div></div>
    <svg baseProfile="full" height="66" style="display:block" version="1.1" width="1680" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="fork-ah" markerHeight="10" markerWidth="10" orient="auto" refX="6" refY="3"><path d="M0,0 L6,3 L0,6 Z" style="fill:var(--gold)" /></marker></defs><path d="M840,0 V30" fill="none" style="stroke:var(--gold);stroke-width:4" /><path d="M260,30 H1420" fill="none" style="stroke:var(--gold);stroke-width:4" /><path d="M260,30 V58" fill="none" marker-end="url(#fork-ah)" style="stroke:var(--gold);stroke-width:4" /><path d="M840,30 V58" fill="none" marker-end="url(#fork-ah)" style="stroke:var(--gold);stroke-width:4" /><path d="M1420,30 V58" fill="none" marker-end="url(#fork-ah)" style="stroke:var(--gold);stroke-width:4" /></svg>
    <div class="forkrow">
    <div class="branch"><div class="cond">Key words</div>
      <div class="res">重点词汇</div>
      <div class="bd">doctor / teacher / policeman …</div></div>
    <div class="branch"><div class="cond">Key sentences</div>
      <div class="res">重点句型</div>
      <div class="bd">What does he do? / He is a doctor.</div></div>
    <div class="branch"><div class="cond">Common jobs</div>
      <div class="res">常见职业</div>
      <div class="bd">医生、教师、警察、厨师…</div></div>
    </div>
    <div class="concl concl">Jobs make the world <b>go round</b>.</div>
  </div>
  <div class="foot-line"></div>
  <div class="foot">Junior High English</div>
</body>
</html>
